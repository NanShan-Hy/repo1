[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacompare"
version = "0.1.0"
description = "Data comparison and deduplication toolkit"
authors = [{name = "DataOps Team"}]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.23",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlsxwriter>=3.0"]

[project.scripts]
datacompare = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
